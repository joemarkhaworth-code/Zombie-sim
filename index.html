<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Zombie Survival</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
    // Cache-busting: the deploy writes version.json and stamps every import with ?v=<commit>,
    // so a refresh always loads the latest code. Locally there's no version.json; load as-is.
    let v = '';
    try {
      const r = await fetch('version.json', { cache: 'no-store' });
      if (r.ok) v = (await r.json()).v;
    } catch (e) { /* offline or local: fall through */ }
    await import(v ? `./src/main.js?v=${v}` : './src/main.js');
  </script>
</body>
</html>
